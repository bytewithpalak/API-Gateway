server.port=8080

spring.cloud.gateway.server.webmvc.routes[0].id=test-route
spring.cloud.gateway.server.webmvc.routes[0].uri=https://httpbin.org
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/test/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=RewritePath=/test/(?<segment>.*), /${segment}

spring.cloud.gateway.server.webmvc.routes[1].id=demo-route
spring.cloud.gateway.server.webmvc.routes[1].uri=https://httpbin.org
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/demo/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=RewritePath=/demo/(?<segment>.*), /${segment}

# --- Database (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/apigateway}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- JWT ---
app.jwt.secret=${JWT_SECRET:CHANGE_ME_local_dev_only_min_32_bytes!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Actuator (for staging health checks / CI readiness probes) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never